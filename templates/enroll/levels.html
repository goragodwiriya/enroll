<form data-form="enrollLevels" action="api/enroll/levels/save" method="post" data-ajax-submit="true" data-load-api="api/enroll/levels/get"
      data-confirm="Confirm save" autocomplete="off">
  <div class="card-groups">
    <header>
      <div>
        <h1 class="icon-elearning" data-i18n>{LNG_List of} {LNG_Education level}</h1>
        <p data-i18n>{LNG_Education level} {LNG_that is open for applications}</p>
      </div>
    </header>
    <div class="content-body">
      <fieldset class="grid">
        <div class="tablebody">
          <table class="table border fullwidth" data-table="enrollLevels" data-editable-rows="true" data-attr="data:table" data-url-params="false">
            <thead>
              <tr>
                <th data-field="id" data-cell-element="number" data-size="5" data-min="1" data-i18n>{LNG_ID}</th>
                <th data-field="topic" data-cell-element="text" data-max-length="150" data-i18n>{LNG_Detail}</th>
                <th data-field="is_active" data-cell-element="switch" data-i18n>{LNG_Active}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="comment" data-i18n>{LNG_ID} {LNG_is used to refer to the education level on the application form. Do not change it after applications have started.}</div>
      </fieldset>
      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
      </fieldset>
    </div>
  </div>
</form>
