<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-list" data-i18n>{LNG_List of} {LNG_Enroll}</h1>
            <p data-i18n>{LNG_Applicants}</p>
          </div>
        </header>
        <div class="content-body">
          <div class="tablebody">
            <form data-table-filter="enrollApplicants" class="table_nav">
              <div>
                <label for="list_level" data-i18n>{LNG_Education level}</label>
                <span class="form-control">
                  <select id="list_level" name="level"></select>
                </span>
              </div>
              <input type="search" name="search" placeholder="{LNG_Search}...">
            </form>
            <table class="table border fullwidth" data-table="enrollApplicants" data-source="api/enroll/applicants" data-default-sort="created_at desc"
                   data-page-size="30" data-search-columns="name">
              <thead>
                <tr>
                  <th data-field="created_at_text" data-sort="created_at" class="nowrap" data-cell-class="nowrap" data-i18n>{LNG_Date}</th>
                  <th data-field="name" data-sort="name" data-i18n>{LNG_Name}</th>
                  <th data-field="plan_text" data-i18n>{LNG_Study plan}</th>
                  <th data-field="result_status_text" class="center" data-cell-class="center"
                      data-template="<span class='${status_class}'>${result_status_text}</span>" data-i18n>{LNG_Result}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Admin Framework - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
